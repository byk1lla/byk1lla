<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7">
        <animate attributeName="stop-color" values="#6ee7b7;#22d3ee;#a78bfa;#6ee7b7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#6ee7b7;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#6ee7b7;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2a44" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 40" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- yüzen renk blobları -->
  <circle cx="250" cy="90" r="120" fill="#6ee7b7" opacity="0.18" filter="url(#soft)">
    <animate attributeName="cx" values="250;380;250" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;200;90" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="230" r="140" fill="#a78bfa" opacity="0.18" filter="url(#soft)">
    <animate attributeName="cx" values="950;820;950" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;110;230" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="160" r="110" fill="#22d3ee" opacity="0.10" filter="url(#soft)">
    <animate attributeName="r" values="110;150;110" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- kayan grid -->
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)" opacity="0.55"/>

  <!-- yükselen partiküller -->
  <g fill="#6ee7b7">
    <circle cx="120" cy="330" r="2"><animate attributeName="cy" values="330;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="330" r="1.5"><animate attributeName="cy" values="330;-10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="330" r="2"><animate attributeName="cy" values="330;-10" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="330" r="1.5" fill="#a78bfa"><animate attributeName="cy" values="330;-10" dur="10s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="330" r="2" fill="#22d3ee"><animate attributeName="cy" values="330;-10" dur="6.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="330" r="1.5"><animate attributeName="cy" values="330;-10" dur="8.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="330" r="2" fill="#a78bfa"><animate attributeName="cy" values="330;-10" dur="7.5s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="330" r="1.5" fill="#22d3ee"><animate attributeName="cy" values="330;-10" dur="9.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9.5s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- tarama çizgisi -->
  <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
    <animate attributeName="y" values="-80;320" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- içerik -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace" text-anchor="middle">
    <text x="600" y="72" font-size="18" fill="#64748b" letter-spacing="6">
      ~/ IEF SOFTWARE
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    </text>
    <text x="600" y="168" font-size="96" font-weight="800" fill="url(#txt)" filter="url(#glow)" letter-spacing="4">
      byk1lla
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="218" font-size="22" fill="#cbd5e1">
      İsmail Efe Erdoğdu · solo founder &amp; developer · İstanbul
    </text>
    <text x="512" y="270" font-size="18" fill="#6ee7b7" text-anchor="start">$ ship --prod</text>
    <rect x="660" y="255" width="11" height="20" fill="#6ee7b7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- çerçeve -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#txt)" stroke-opacity="0.45" stroke-width="2"/>
</svg>
